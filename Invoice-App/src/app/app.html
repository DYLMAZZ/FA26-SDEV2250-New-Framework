<div class="invoice-container">

  <h3>Invoice Sheet</h3>

  <div class="invoice-wrapper">

    <table
      class="sheet"
      *ngFor="let sheet of sheets"
      [attr.id]="'sheet' + sheet.id">
      <thead>
        <tr>
          <th>Item</th>
          <th>Quantity</th>
          <th>Rate/Cost</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of sheet.items">
          <td>
            <input
              type="text"
              name="item"
              [(ngModel)]="item.item">
          </td>
          <td>
            <input
              type="number"
              name="quantity"
              [(ngModel)]="item.quantity"
              step="0.01">
          </td>
          <td>
            <input
              type="number"
              name="cost"
              [(ngModel)]="item.cost"
              step="0.01">
          </td>
          <td>
            <input
              type="number"
              [ngModel]="calculateItemTotal(item)"
              readonly>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>
            <button
              type="button"
              class="addRow"
              (click)="addRow(sheet)">
              +
            </button>
          </td>
          <td></td>
          <td>Sub Total:</td>
          <td>
            <input
              type="number"
              [ngModel]="calculateSubtotal(sheet)"
              readonly>
          </td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td>
            Tax:
            <input
              class="tax-input"
              type="number"
              [(ngModel)]="sheet.tax"
              step="0.01"> %
          </td>
          <td>
            <input
              type="number"
              [ngModel]="calculateTax(sheet)"
              readonly>
          </td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td><strong>Total</strong></td>
          <td>
            <input
              type="number"
              [ngModel]="calculateTotal(sheet)"
              readonly>
          </td>
        </tr>
      </tfoot>
    </table>

  </div>

</div>
